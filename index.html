<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificação Toast Elegante</title>
  <!-- Fonte moderna Inter do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Folha de estilos CSS externa -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Container principal centralizado -->
  <main class="main-container">
    <div class="card">
      <h1 class="title">Sistema de Notificações</h1>
      <p class="subtitle">Clique no botão abaixo para disparar um alerta visual personalizado no canto da tela.</p>
      
      <!-- Botão interativo que dispara o Toast -->
      <button id="btn-notify" class="btn">
        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        Clique aqui
      </button>
    </div>
  </main>

  <!-- Container flutuante onde os toasts serão adicionados dinamicamente via JS -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Script JavaScript externo -->
  <script src="script.js"></script>
</body>
</html>
